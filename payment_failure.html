<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Fallido | Zonal Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF4D4D;
            --secondary: #FF0055;
            --error: #EF4444;
            --bg: #0F172A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 77, 77, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.1) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 32px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-container {
            width: 100px;
            height: 100px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            position: relative;
        }

        .icon-container svg {
            width: 50px;
            height: 50px;
            color: var(--error);
            animation: errorScale 0.8s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        @keyframes errorScale {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 16px;
            font-weight: 600;
            display: block;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(255, 77, 77, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            animation: spin 1s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .countdown {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <h1>¡Pago Cancelado!</h1>
        <p>Tu transacción no pudo completarse o fue cancelada. Regresa a la app para volver a intentarlo.</p>
        
        <a id="redirectLink" href="zonalstation://" class="btn">
            <span class="loader"></span> Volver a la App
        </a>

        <div class="countdown">
            Serás redirigido automáticamente en <span id="seconds">5</span> segundos...
        </div>

        <a href="index.html" style="display: inline-block; margin-top: 1.5rem; color: #FF4D4D; font-size: 0.9rem; text-decoration: none; font-weight: 600; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
            Ir a la página principal
        </a>
    </div>

    <script>
        // Intentar redirigir inmediatamente
        const appScheme = "zonalstation://";
        window.location.href = appScheme;

        // Si el esquema falla, el contador sigue
        let timeLeft = 5;
        const secondsSpan = document.getElementById('seconds');
        
        const countdown = setInterval(() => {
            timeLeft--;
            secondsSpan.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = appScheme;
            }
        }, 1000);

        // Capturar parámetros de URL (MP envía payment_id, status, etc)
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('bookingId');
        if (bookingId) {
            document.getElementById('redirectLink').href = `${appScheme}payment-failure?bookingId=${bookingId}`;
        }
    </script>
</body>
</html>
